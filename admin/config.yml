backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio"
    files:
      - name: "projects"
        label: "Projects"
        file: "content/projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Cover Image", name: "image", widget: "string", required: false }
              - { label: "Video URL", name: "video_url", widget: "string", required: false, hint: "Paste the Cloudinary video URL here." }
              - { label: "Category", name: "tag", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
